# =====================================================================
# e2e-kernel: setting test (masuk git).
# Koneksi & credential di file .env (tidak masuk git), contoh isi ada di README.
# ${VAR:-default} = dari environment variable / .env, kalau kosong pakai default (sama dengan kernel v2).
# =====================================================================

# --- NATS: publish seperti iot-gateway ke <tube>.<imei> di stream ---
nats:
  host: ${ENDPOINT_NATS_HOST:-127.0.0.1}
  port: ${ENDPOINT_NATS_PORT:-4222}
  stream: iot-gateway
  tube: PACKET

# --- DB kernel v2 (primary, bukan read replica) ---
db:
  host: ${HOST_DB_IOT:-localhost}
  port: ${PORT_DB_IOT:-5432}
  user: ${USER_DB_IOT:-kernel}
  password: ${PASSWORD_DB_IOT:-password}
  name: ${DB_IOT:-iot}
  schema: ${SCHEMA_IOT:-vsms}
  use_rds_proxy: ${USE_RDS_PROXY:-false}
  max_conn: 5

# --- Device test per family (harus terdaftar di DB) ---
# Override per case: `imei: {concox: ...}` / `models: {concox: ...}`, atau --imei.
devices:
  teltonika:
    imei: "350000000000001"
    model: fmb130                  # DeviceModelEnum
  concox:
    imei: "358000000000001"
    model: gt06n
  topflytech:
    imei: "351000000000001"
    model: solarx-110
  ruptela:
    imei: "352000000000001"
    model: fm_pro4
  queclink:
    imei: "353000000000001"
    model: gv58cg

device_tz: 7                       # jam, untuk protocol waktu lokal (concox 0x12 / 0x16)
company_id: 0                      # TODO: company khusus test

# --- Default pesan gate: connect / xmit (bisa override per step) ---
gate:
  ip_gate: ${E2E_GATE_IP:-127.0.0.1}   # connect: HOST_KERNEL gate (tujuan kernel kirim command)
  port_gate: 0                     # connect: PORT_KERNEL gate. TODO: isi port gate
  xmit_ip: 127.0.0.1               # xmit: ip client external
  xmit_port: 0                     # xmit: port client external

# --- Default waktu (kalau case tidak isi start / interval) ---
scenario:
  start: now                       # mis. now-00:20:00
  interval: 30s

# --- Nilai awal field device di step pertama (dipakai hanya jika family mendukung field-nya) ---
field_defaults:
  altitude: 10
  speed: 0
  direction: 0
  engine_on: false
  position_status: true
  gps_satellites: 10
  gsm_status: 4                    # teltonika: gsm_signal_strength raw. topflytech / ruptela: level 0-4

# --- Nilai awal khusus per family ---
family_defaults:
  teltonika:
    codec: 8e                      # 8 / 8e
  concox:
    lbs: {mcc: 510, mnc: 10, lac: 0, cell_id: 0}      # Indonesia, Telkomsel
    battery: 6                     # level 0-6 (heartbeat / alarm)
    signal_strength: 4             # 0-4 (heartbeat / alarm)

# --- Cek device sebelum run (versions/<v>/setup.py, hanya baca DB) ---
# Device harus terdaftar: device -> vehicle -> vehicle_status, sensor speed + sensor di sheet setup usecase.
# Belum terdaftar = scenario x family dilewati (SKIP).
preflight:
  force: false                     # vehicle_status belum di-reset: false = SKIP, true = WARN tapi tetap jalan

# --- Cek expected ke DB ---
timeout:
  step: 00:00:30                   # tunggu maksimal per step sampai DB cocok
  poll: 00:00:02                   # jeda antar query saat menunggu
  clock_skew: 00:00:05             # toleransi beda jam mesin test vs server kernel/DB
  negative_window: 00:00:05
match:
  approx_tolerance: 0.00001        # toleransi default `~ x` (cukup untuk koordinat)
  on_check_fail: continue          # 1 cek gagal di step: continue = cek lain di step itu tetap jalan, stop = berhenti
                                   # (step berikutnya tidak dijalankan kalau ada cek gagal, kecuali run --keep-going)
