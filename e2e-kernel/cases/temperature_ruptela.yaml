# Test case temperature_ruptela: timeline (sheet notes/db_requirements/settings/setup/timeline).
# Dibuat oleh generators/temperature_ruptela.py: ubah generatornya lalu python cli.py generate --usecase temperature_ruptela
# (bukan edit YAML / Excel, generate ulang menimpa file ini)

usecase: temperature_ruptela
description: |
  Unik ruptela:
    nilai dallas mentah 0.1 C. Kode error 2000-2004 / 850 -> raw_alert 76 flag true, alert_data = teks error
    (No device, Faulty bus, CRC error, No data, Out of range, Power supply too low), suhu tidak dipakai.
    Tidak ada batas -55..125 C: 125.1 / -55.1 tetap disimpan. 85.0 C = kode 850, bukan suhu.
  Kasus:
    Awal  parkir depot, freezer pre-cooling: wire 1 -10.2 C 00:00:00, -11.3 C 00:05:00 (di atas alert_idle_hi -12)
          -> alert : tidak ada: paket pertama hanya mulai timer, 00:05:00 baru 300 detik (harus > 300)
          -> db    : raw_alert 76 flag false per wire (status pertama), vehicle_status.temperature, raw_sensor_info baris 1
    A     jalan: freezer -14 C 01:00:00-01:06:00 (di atas alert_hi -15)
          -> alert : TEMPERATURE_1 01:00:00 + 01:05:10 (> 300 detik sejak alert sebelumnya), flag true, trigger -15
          -> db    : raw_sensor_info baris saat alert
    B     jalan: freezer -26 C 01:30:00-01:32:00 (di bawah alert_lo -25)
          -> alert : TEMPERATURE_1 01:30:00 saja (< 300 detik), trigger -25
    C     jalan: chiller -1 C 01:45:00-01:48:00 (di bawah alert_lo 0)
          -> alert : TEMPERATURE_2 01:45:00, trigger 0 [BUG kernel known_bug: alert_lo 0 diabaikan (if alert_lo and ...)]
    D     berhenti mesin hidup 02:00-02:20 (motion I 5 menit setelah berhenti): chiller 11 C 02:08:00-02:12:00
          -> alert : TEMPERATURE_2 idle 02:08:00 (di atas alert_idle_hi 10), flag false
    E     jalan: sensor wire 3 lepas 02:30:00-02:50:00, kirim 2000 (No device)
          -> alert : raw_alert 76 wire 3 flag true 'No device' 02:30:00, flag false 02:50:00
          -> health: TEMP-02 temperature-3 02:29:50 - 02:50:00, data error >= 11 menit (aktif 02:40:50)
          -> db    : 02:40:00 (> 10 menit tanpa suhu wire 3): vehicle_status.temperature[3] + raw_sensor_info.temperature3 NULL, terisi lagi 02:50:00
    F     jalan: wire 2 satu paket error 03:00:00 2001, 03:05:00 2002, 03:10:00 2003, 03:15:00 2004
          -> alert : raw_alert 76 wire 2 flag true (Faulty bus, CRC error, No data, Out of range), flag false di paket berikutnya: 8 baris
          -> health: tidak ada (< 11 menit)
          -> db    : suhu wire 2 tetap nilai terakhir
    H     jalan: wire 3 125.0 / 125.1 / -55.0 / -55.1 C 03:50:00-03:50:30
          -> alert : tidak ada (wire 3 tanpa batas alert)
          -> db    : semua disimpan, tidak ada batas -55..125
    I     jalan: wire 3 85.0 C 03:55:00
          -> alert : raw_alert 76 wire 3 flag true 'Power supply too low', flag false 03:55:10
          -> db    : 85.0 tidak disimpan
    J     jalan: sinyal hilang 04:00:00-04:13:00 (tanpa record)
          -> alert : tidak ada
          -> health: TEMP-01 temperature-1 03:59:50 - 04:13:00, tidak ada data >= 11 menit
          -> health: TEMP-01 temperature-2 03:59:50 - 04:13:00
          -> health: TEMP-01 temperature-3 03:59:50 - 04:13:00
          -> health: 13 menit < 16: belum GPS-01
          -> db    : suhu tidak di-reset: paket berikutnya membawa semua wire
    K     parkir: kabin 27.0 C tetap 05:00:00-05:30:00 (wire lain tetap berubah)
          -> alert : tidak ada
          -> health: TEMP-03 temperature-3 05:00:00 - 05:30:00, nilai sama >= 11 menit (aktif 05:15:00)
    L     parkir semalam: freezer mati -11 C H1 06:00:00 dan H2 06:00:00-06:15:00 (di atas alert_idle_hi -12)
          -> alert : TEMPERATURE_1 idle H1 06:00:00, H2 06:00:00 [BUG kernel known_bug: jeda 1 hari dihitung 0 detik (timedelta.seconds)], H2 06:10:00 (H2 06:05:00 baru 300 detik)
    M     raw_sensor_info: jalan 00:30-01:00 (suhu berubah tiap paket), parkir 05:00-06:00 (paket 5 menit)
          -> alert : tidak ada
          -> db    : jalan: 1 baris tiap >= 60 detik (30 baris), parkir: tiap paket (12 baris)
    N     parkir: wire 1 tidak dikirim H1 23:30:00-H2 00:30:00 (sensor dicabut)
          -> alert : tidak ada
          -> health: TEMP-01 temperature-1 23:25:00 - 00:30:00, data terakhir = paket parkir 23:25:00
          -> db    : wire 1 NULL setelah > 10 menit, terisi lagi H2 00:30:00
    O     parkir semalam: kabin 24.5 C tetap H2 00:00:00-06:00:00
          -> alert : tidak ada
          -> health: TEMP-03 temperature-3 00:00:00 - 06:00:00, nilai sama 6 jam
    P     jalan: wire 1 tidak dikirim H2 07:00:00-07:30:00
          -> alert : tidak ada
          -> health: TEMP-01 temperature-1 06:59:50 - 07:30:00
          -> db    : wire 1 NULL setelah > 10 menit
    Q     jalan: wire 1 tidak dikirim dan chiller 3.7 C tetap, sama-sama 10 menit H2 07:45:00-07:54:50
          -> alert : tidak ada
          -> health: tidak ada (< 11 menit)
          -> db    : wire 1 tidak di-reset (tepat 600 detik, harus > 600)
    R     jalan: chiller 85.0 C H2 08:00:00-08:29:50
          -> alert : raw_alert 76 wire 2 flag true 'Power supply too low', flag false 08:30:00
          -> health: TEMP-02 temperature-2 07:59:50 - 08:30:00
          -> db    : chiller tetap nilai terakhir lalu NULL setelah > 10 menit
    S     jalan bersamaan H2 09:00:00-09:30:00: wire 1 tidak dikirim, chiller 3.5 C tetap, kabin 85.0 / 150.0 bergantian
          -> alert : raw_alert 76 wire 3 flag true (85.0) / false (150.0 suhu valid) tiap paket
          -> health: TEMP-01 temperature-1 08:59:50 - 09:30:00
          -> health: TEMP-03 temperature-2 09:00:00 - 09:30:00
          -> health: TEMP-03 temperature-3 09:00:10 - 09:30:00
          -> health: kabin: 150.0 selalu sama -> TEMP-03 (bukan TEMP-02)
    T     jalan: kabin 150.0 C H2 10:00:00-10:29:50
          -> alert : tidak ada (kabin tanpa batas alert)
          -> health: TEMP-03 temperature-3 10:00:00 - 10:30:00
          -> health: 150.0 disimpan dan tidak berubah: TEMP-03
    U     jalan: kabin hanya terkirim tiap 12 menit (H2 11:12, 11:24, 11:36, 11:48), sisanya tidak dikirim H2 11:00:10-11:59:50
          -> alert : tidak ada
          -> health: TEMP-01 temperature-3 11:00:00 - 11:12:00, jeda 12 menit >= 11, 1 summary per sampel
          -> health: TEMP-01 temperature-3 11:12:00 - 11:24:00
          -> health: TEMP-01 temperature-3 11:24:00 - 11:36:00
          -> health: TEMP-01 temperature-3 11:36:00 - 11:48:00
          -> health: TEMP-01 temperature-3 11:48:00 - 12:00:00
          -> db    : kabin NULL di antara sampel (> 10 menit), terisi di tiap sampel
    V     jalan: kabin 85.0 C H2 12:15:00-12:29:50 lalu 150.0 C 12:30:00-12:44:50
          -> alert : raw_alert 76 wire 3 flag true 12:15:00, flag false 12:30:00
          -> health: TEMP-02 temperature-3 12:14:50 - 12:30:00, 85.0 = error
          -> health: TEMP-03 temperature-3 12:30:00 - 12:45:00, 150.0 tetap
    X     jalan: semua wire 85.0 C H2 13:45:00-14:14:50
          -> alert : raw_alert 76 wire 1-3 flag true 'Power supply too low', flag false 14:15:00
          -> health: TEMP-02 temperature-1 13:44:50 - 14:15:00
          -> health: TEMP-02 temperature-2 13:44:50 - 14:15:00
          -> health: TEMP-02 temperature-3 13:44:50 - 14:15:00
          -> db    : semua wire NULL setelah > 10 menit
    Y     jalan: wire 1 tidak dikirim H2 14:30:00-14:59:50, kembali dengan nilai sama -18.0 C
          -> alert : tidak ada
          -> health: TEMP-01 temperature-1 14:29:50 - 15:00:00
          -> health: bukan TEMP-03: wire 1 sudah di-reset NULL, jadi -18.0 dihitung berubah (expected device_health_TEMP kernel masih TEMP-03)
          -> db    : wire 1 NULL setelah > 10 menit
db_requirements:
- device ruptela, fm_pro4 -> imei 352000000000011
- sensor speed (sensor_code 6)
- sensor temperature_1 (sensor_code 12, pin_code 11 (dallas1_wire1), alert_hi -15, alert_lo -25, alert_idle_hi -12, alert_idle_lo -25)
- sensor temperature_2 (sensor_code 11, pin_code 12 (dallas1_wire2), alert_hi 8, alert_lo 0, alert_idle_hi 10, alert_idle_lo 1)
- sensor temperature_3 (sensor_code 36, pin_code 13 (dallas1_wire3), tanpa batas alert)
families: [ruptela]
start: today-2d
interval: 00:00:10
tags: [temperature]
imei: {ruptela: '352000000000011'}
models: {ruptela: fm_pro4}
carry_over: false
setup:
  sensors:
  - {code: temperature_1, pin: dallas1_wire1}
  - {code: temperature_2, pin: dallas1_wire2}
  - {code: temperature_3, pin: dallas1_wire3}
