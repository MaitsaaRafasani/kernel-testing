# Test case door_concox: timeline (sheet notes/db_requirements/settings/setup/timeline).
# Dibuat oleh generators/door_concox.py: ubah generatornya lalu python cli.py generate --usecase door_concox
# (bukan edit YAML / Excel, generate ulang menimpa file ini)

usecase: door_concox
description: |
  Kasus:
    Awal  Data pertama: door1 closed 00:00:03, door2 0.03 V 00:00:05
          -> alert : close door1 00:00:03, close door2 00:00:05
          -> health: tidak ada
    A     Door1 (digital_1), normal open close, kendaraan parkir
          -> alert : open 00:31:20, close 00:42:40
          -> health: tidak ada
    B     Door2 (analog_1), normal open close 12.31 V / 0.02 V, kendaraan parkir
          -> alert : open 00:33:45, close 00:38:05
          -> health: tidak ada
    C     Door1 open 01:05:21, close 01:05:23 dalam 2 detik, kendaraan jalan
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada: glitch bukan perubahan valid, tidak dihitung DOOR-03
    D     Door2 open 01:20:35, close 01:20:45, kendaraan jalan
          -> alert : open 01:20:35, close 01:20:45
          -> health: DOOR-03 door-2 01:20:35 - 01:20:45
    E     Door1 open 01:30:12, close 01:30:16 dalam 4 detik, kendaraan jalan
          -> alert : open 01:30:12, close 01:30:16
          -> health: DOOR-03 door-1 01:30:12 - 02:21:50
    F     Door1 open 01:42:30, close 02:21:50 (39 menit), kendaraan parkir
          -> alert : open 01:42:30, open too long 02:00:00, close 02:21:50
          -> health: tidak ada
    G     Door2 open 01:44:15, close 02:05:25 (21 menit), kendaraan parkir
          -> alert : open 01:44:15, open too long 01:54:15, close 02:05:25
          -> health: tidak ada
    H     Door2 4.99 V 03:12:15, 5.00 V 03:13:45, 0.05 V 03:19:15, kendaraan parkir
          -> alert : open 03:13:45, close 03:19:15
          -> health: tidak ada
    I     Door1 open 04:21:30, close 04:27:04 dalam 2 detik, close 04:47:30, kendaraan parkir
          -> alert : open 04:21:30, open too long 04:40:00, close 04:47:30
          -> health: tidak ada
    J     Door2 open 05:05:15, close 05:21:05 (16 menit), kendaraan jalan
          -> alert : open 05:05:15, open too long 05:15:15, close 05:21:05
          -> health: DOOR-02 door-2 05:05:15 - 05:21:05, terbuka 10.1 km saat jalan
    K     Door1 open 05:41:14, close 05:52:40 (11 menit), kendaraan parkir
          -> alert : open 05:41:14, close 05:52:40
          -> health: tidak ada
    L     Sinyal hilang 02:40:00 - 02:52:00, door tertutup, kendaraan jalan
          -> alert : tidak ada
          -> health: DOOR-01 door-2 02:39:55 - 02:52:05, sampel door2 hilang 12 menit
          -> health: door1 bukan DOOR-01 (dikirim saat berubah), belum GPS-01 (< 16 menit)
    M     H2 door1 glitch 4x (08:05:21 - 08:06:53, tiap glitch 2 detik), kendaraan jalan < 10 km
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada: glitch tidak dihitung DOOR-03
    N     H2 door2 open close 4x (08:10:05 - 08:11:45, tiap open 10 detik), kendaraan jalan < 10 km
          -> alert : open 4x, close 4x
          -> health: DOOR-03 door-2 H2 08:10:05 - H2 08:11:45, 8 perubahan dalam 10 km
    O     H2 door1 glitch 4x (14:00:21 - 14:03:23, tiap glitch 2 detik), kendaraan parkir mesin mati
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada
    P     H2 door2 open close 4x (15:00:05 - 15:35:05, tiap open 5 menit), kendaraan parkir mesin mati
          -> alert : open 4x, close 4x
          -> health: tidak ada: parkir tidak dihitung DOOR-03
    Q     H3 door1 glitch 4x (08:04:21 - 08:24:23, tiap glitch 2 detik), kendaraan jalan 12.9 km (> 10 km)
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada
    R     H3 door2 open close 4x (08:03:05 - 08:23:15, tiap open 10 detik), kendaraan jalan 13.2 km (> 10 km)
          -> alert : open 4x, close 4x
          -> health: DOOR-03 door-2 H3 08:03:05 - H3 08:13:15, 6 perubahan dalam 10 km pertama
          -> health: DOOR-03 door-2 H3 08:23:05 - H3 08:23:15, 2 perubahan dalam 10 km berikutnya
    S     Door1 closed 3 hari jalan (H2 32 km, H3 38 km, H4 29 km), open H5 08:30:15, close H5 08:40:15
          -> alert : open H5 08:30:15, close H5 08:40:15
          -> health: DOOR-04 door-1 H1 05:52:40 - H5 08:30:15, aktif mulai H5 00:00:00
    T     Door2 closed 3 hari jalan (H3 23 km, H4 29 km, H5 29 km), open H6 08:30:05, close H6 08:35:05
          -> alert : open H6 08:30:05, close H6 08:35:05
          -> health: DOOR-04 door-2 H3 08:23:15 - H6 08:30:05, aktif mulai H6 00:00:00
