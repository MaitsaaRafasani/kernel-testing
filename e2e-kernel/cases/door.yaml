# Test case door: timeline (sheet notes/db_requirements/settings/setup/timeline).
# Dibuat oleh generators/door.py: ubah generatornya lalu python cli.py generate --usecase door
# (bukan edit YAML / Excel, generate ulang menimpa file ini)

usecase: door
description: |
  Kasus:
    Awal  Record pertama 00:00:00, semua door closed
          -> alert : close door1 + door2 00:00:00
          -> health: tidak ada
    A     Door1 (digital_2), normal open close, kendaraan parkir
          -> alert : open 00:31:20, close 00:42:40
          -> health: tidak ada
    B     Door2 (digital_3), normal open close (18 menit), kendaraan parkir
          -> alert : open 00:33:45, close 00:52:05
          -> health: tidak ada
    C     Door1 open 01:05:21, close 01:05:23 dalam 2 detik, kendaraan jalan
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada: glitch bukan perubahan valid, tidak dihitung DOOR-03
    D     Door1 open 01:12:28, close 01:12:31 dalam 3 detik, kendaraan jalan
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada: C + D = 4 perubahan mentah, tapi tidak ada yang valid
    E     Door1 open 01:30:12, close 01:30:16 dalam 4 detik, kendaraan jalan
          -> alert : open 01:30:12, close 01:30:16
          -> health: DOOR-03 door-1 01:30:12 - 02:21:50, 2 perubahan valid saat jalan, end = close F
    F     Door1 open 01:42:30, close 02:21:50 (39 menit), kendaraan parkir
          -> alert : open 01:42:30, open too long 01:57:40, close 02:21:50
          -> health: tidak ada
    G     Door2 open 01:57:40, close 02:10:15, kendaraan parkir
          -> alert : open 01:57:40, close 02:10:15
          -> health: tidak ada
    H     Sinyal hilang 02:40:00 - 03:00:00, door1 open saat offline, close 03:10:45, kendaraan jalan
          -> alert : open 03:00:00 (record pertama setelah online), close 03:10:45
          -> health: DOOR-01 door-1 02:39:50 - 03:00:00, tidak ada data door 20 menit
          -> health: DOOR-01 door-2 02:39:50 - 03:00:00
          -> health: GPS-01 02:39:50 - 03:00:00, tidak ada lokasi 20 menit
    I     Door2 open 03:12:01, close 03:12:03, open 03:12:05, close 03:30:10, kendaraan parkir
          -> alert : open 03:12:05, close 03:30:10 (03:12:01 glitch)
          -> health: tidak ada
    J     Door2 open 03:41:15, close 04:05:25 (24 menit), kendaraan jalan
          -> alert : open 03:41:15, close 04:05:25
          -> health: DOOR-02 door-2 03:41:15 - 04:05:25, terbuka 15.8 km saat jalan
    K     Door1 open 04:21:30, close 04:27:04 dalam 2 detik, close 04:47:30, kendaraan parkir
          -> alert : open 04:21:30, open too long 04:40:00, close 04:47:30
          -> health: tidak ada
    L     Door1 open 05:05:15, close 05:25:05 (20 menit), kendaraan jalan
          -> alert : open 05:05:15, open too long 05:20:20, close 05:25:05
          -> health: DOOR-02 door-1 05:05:15 - 05:25:05, terbuka 12.5 km saat jalan
    M     Door1 open 05:41:14, close 05:52:40 (11 menit), kendaraan parkir
          -> alert : open 05:41:14, close 05:52:40
          -> health: tidak ada
    N     H2 door1 glitch 4x (08:05:21 - 08:06:53, tiap glitch 2 detik), kendaraan jalan < 10 km
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada: glitch tidak dihitung DOOR-03
    O     H2 door2 open close 4x (08:10:05 - 08:11:45, tiap open 10 detik), kendaraan jalan < 10 km
          -> alert : open 4x, close 4x
          -> health: DOOR-03 door-2 H2 08:10:05 - H2 08:11:45, 8 perubahan dalam 10 km
    P     H2 door1 glitch 4x (14:00:21 - 14:03:23, tiap glitch 2 detik), kendaraan parkir mesin mati
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada
    Q     H2 door2 open close 4x (15:00:05 - 15:35:05, tiap open 5 menit), kendaraan parkir mesin mati
          -> alert : open 4x, close 4x
          -> health: tidak ada: parkir tidak dihitung DOOR-03
    R     H3 door1 glitch 4x (08:04:21 - 08:24:23, tiap glitch 2 detik), kendaraan jalan 12.9 km (> 10 km)
          -> alert : tidak ada (glitch <= 3 detik)
          -> health: tidak ada
    S     H3 door2 open close 4x (08:03:05 - 08:23:15, tiap open 10 detik), kendaraan jalan 13.2 km (> 10 km)
          -> alert : open 4x, close 4x
          -> health: DOOR-03 door-2 H3 08:03:05 - H3 08:13:15, 6 perubahan dalam 10 km pertama
          -> health: DOOR-03 door-2 H3 08:23:05 - H3 08:23:15, 2 perubahan dalam 10 km berikutnya
    T     Door1 closed 3 hari jalan (H2 32 km, H3 38 km, H4 29 km), open H5 08:30:15, close H5 08:40:15
          -> alert : open H5 08:30:15, close H5 08:40:15
          -> health: DOOR-04 door-1 H1 05:52:40 - H5 08:30:15, aktif mulai H5 00:00:00
    U     Door2 closed 3 hari jalan (H3 23 km, H4 29 km, H5 29 km), open H6 08:30:05, close H6 08:35:05
          -> alert : open H6 08:30:05, close H6 08:35:05
          -> health: DOOR-04 door-2 H3 08:23:15 - H6 08:30:05, aktif mulai H6 00:00:00
