# Expected v2 usecase device_health_gps (sheet expected_v2).
# Dibuat oleh generators/device_health_gps.py: ubah generatornya lalu python cli.py generate --usecase device_health_gps
# (bukan edit YAML / Excel, generate ulang menimpa file ini)

device_health_gps:
