# Expected v2 usecase device_health_refri (sheet expected_v2).
# Edit lewat Excel: python cli.py yaml2excel --usecase device_health_refri -> edit cases/excel/device_health_refri.xlsx
#                   -> python cli.py excel2yaml --usecase device_health_refri -> hapus xlsx (tidak masuk git)

device_health_refri:
  default:
    steps:
      end:
        db:
        - {table: vehicle_status, where: {vehicle_id: $vehicle_id}, match: {last_packet: $step_at}, timeout: '00:10:00', note: tunggu kernel selesai memproses data terakhir}
        - {table: summary_device_error, where: {vehicle_id: $vehicle_id, start_time: {between: ['H1 00:20:00', 'H5 00:00:00']}}, count: 29, note: jumlah semua summary device health sejak awal timeline}
        - {table: summary_device_error, where: {vehicle_id: $vehicle_id, error_type: REFRI-01, start_time: 'H1 00:59:50', end_time: 'H1 01:30:00'}, count: 1, note: 'dibuat H1 01:30:00'}
        - {table: summary_device_error, where: {vehicle_id: $vehicle_id, error_type: REFRI-01, start_time: 'H1 03:00:00', end_time: 'H1 03:12:00'}, count: 1, note: 'dibuat H1 03:12:00'}
        - {table: summary_device_error, where: {vehicle_id: $vehicle_id, error_type: REFRI-01, start_time: 'H1 03:12:00', end_time: 'H1 03:24:00'}, count: 1, note: 'dibuat H1 03:24:00'}
